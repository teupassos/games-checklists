<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca de checklists de jogos</title>
<style>
:root{
  --bg:#101418;
  --s:#18222d;
  --card-bg:#1e2a38;
  --card-hover:#243447;
  --ink:#f3f6f8;
  --mu:#8a9dae;
  --ln:#2d3e50;
  --ac:#2a97a5;
  --ac-bright:#3bc4d5;
  --ai:#ffffff;
  --bad:#e85a5a;
  --shadow:0 8px 20px rgba(0,0,0,0.4);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#101418;
    --s:#18222d;
    --card-bg:#1e2a38;
    --card-hover:#243447;
    --ink:#f3f6f8;
    --mu:#8a9dae;
    --ln:#2d3e50;
    --ac:#2a97a5;
    --ac-bright:#3bc4d5;
    --ai:#ffffff;
    --bad:#e85a5a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:0.2px}
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.5rem;font-weight:700;margin:0 0 4px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
h2{font-size:0.95rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

button,input,select,textarea{font:inherit;color:var(--ink);background:var(--s);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;transition:all 0.15s ease}
button{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px}
button:hover{border-color:var(--ac);color:#fff;background:#223040}
button.p{background:var(--ac);color:var(--ai);border-color:var(--ac)}
button.p:hover{background:var(--ac-bright);border-color:var(--ac-bright)}
button.d,.bad{color:var(--bad)}
button.d:hover{background:rgba(232,90,90,0.15);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--ac-bright);outline-offset:2px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.row>input[type=search]{flex:1 1 180px;background:#141d26}

/* GRADE DA BIBLIOTECA STEAM */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:20px;
  margin-top:16px;
}

/* CARDS */
.card{
  background:var(--card-bg);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:8px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow);
  transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 28px rgba(0,0,0,0.6);
  border-color:rgba(42,151,165,0.4);
  background:var(--card-hover);
}

/* CAPA VERTICAL STEAM (2:3) */
.cv{
  position:relative;
  width:100%;
  aspect-ratio:2/3;
  background:linear-gradient(145deg, #1f2d3a, #101720);
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,0.4);
  font-size:3rem;
  font-weight:800;
  overflow:hidden;
}
.cv img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 25%;
  transition:transform 0.3s ease;
}
.card:hover .cv img{
  transform:scale(1.04);
}

/* CONTEÚDO DO CARD */
.cb{
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:1;
}
.cb h2{
  margin-bottom:2px;
}
.cb .row{
  margin:6px 0 0;
  gap:4px;
}
.cb button{
  padding:3px 7px;
  font-size:0.75rem;
  border-radius:4px;
  flex:1;
}

/* BARRAS DE PROGRESSO COMPACTAS */
.bar{
  height:5px;
  background:#121a22;
  border-radius:3px;
  overflow:hidden;
  margin:2px 0 4px;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg, var(--ac), var(--ac-bright));
  border-radius:3px;
  transition:width 0.3s ease;
}

.mu{
  color:var(--mu);
  font-size:0.78rem;
  line-height:1.2;
}

/* CHECKLIST & DETALHES */
details{
  background:var(--card-bg);
  border:1px solid var(--ln);
  border-radius:8px;
  margin-bottom:8px;
  overflow:hidden;
}
summary{
  cursor:pointer;
  padding:10px 14px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:rgba(0,0,0,0.15);
  user-select:none;
}
summary:hover{
  background:rgba(255,255,255,0.03);
}
.q{
  display:flex;
  gap:8px;
  align-items:center;
  padding:6px 12px;
  border-top:1px solid rgba(255,255,255,0.03);
}
.q:hover{
  background:rgba(255,255,255,0.02);
}
.q label{
  flex:1;
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}
.q input{
  width:16px;
  height:16px;
  flex:none;
  margin:0;
  accent-color:var(--ac);
}
.q.ok .n{
  color:var(--mu);
  text-decoration:line-through;
  opacity:0.7;
}
.q.lost .n{
  color:var(--bad);
}
.q button{
  padding:2px 6px;
  font-size:0.75rem;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:99;
}
.mb{
  background:var(--s);
  border:1px solid var(--ln);
  border-radius:12px;
  max-width:620px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 16px 32px rgba(0,0,0,0.6);
}
textarea{
  width:100%;
  min-height:140px;
  font:0.8rem/1.4 ui-monospace,Consolas,monospace;
  background:#101720;
}
#msg{
  display:none;
  background:var(--s);
  border-left:4px solid var(--bad);
  padding:10px 14px;
  margin:10px 0;
  border-radius:0 6px 6px 0;
}

@media(max-width:480px){
  .grid{
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
  }
  .cb button{
    padding:3px 4px;
    font-size:0.7rem;
  }
}
</style></head><body><main>
<div id="msg" role="alert"></div><div id="app"></div><p id="st" class="mu"></p></main>
<script>
/*CORE*/
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/…/g,"...").toLowerCase().trim();
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
function stats(g,pr){const s={main:[0,0,0],all:[0,0,0],cat:{}};
 for(const q of g.quests){const st=pr[q.id]||0,c=s.cat[q.cat]||(s.cat[q.cat]=[0,0,0]);
  for(const a of [s.all,c,...(q.main?[s.main]:[])]){a[1]++;if(st==1)a[0]++;if(st==2)a[2]++}}
 return s}
function validBase(b){const e=[];

 const g=b.game;if(!g||!/^[a-z0-9-]{2,60}$/.test(g.id||"")||!g.title)e.push("game.id (a-z, 0-9, -) e game.title são obrigatórios.");

  if(!q||typeof q.name!=="string"||!q.name)e.push(w+"name ausente.");

 return e.slice(0,15)}
const TB="Tradição dos Bruxos: ";
function ptMap(html){const m=new Map([["Viper School Gear",TB+"Equipamento da Escola da Víbora"]]);
 [["Grifo","Griffin",4],["Gato","Cat",4],["Urso","Bear",4],["Lobo","Wolf",6]].forEach(([p,e,n])=>{m.set(e+" School Gear",TB+"Equipamento da Escola do "+p);
  for(let i=1;i<=n;i++)m.set(`${e} School Gear Upgrade Diagrams – Part ${i}`,TB+(p=="Grifo"&&i==1?"Diagramas da Escola do Grifo - Parte 1":`Diagrama de Melhorias do Equipamento da Escola do ${p} - Parte ${i}`));
  if(p=="Lobo")m.set("Forgotten Wolf School Gear Diagrams",TB+"Diagramas Esquecidos da Escola do Lobo")});
 if(html)for(const x of html.matchAll(/"([^"=\n]+)=([^"\n]+)"/g))if(!m.has(x[1]))m.set(x[1],x[2]);
 return m}
function legacyBase(txt,html){
 const cats={},quests=[],prog={},hd={},got={},ids=new Set(),pt=ptMap(html);let c=null,gr="",bad=0;

  if(m=l.match(/^##\s*(.+?)\s*\((\d+)\/(\d+)\)\s*$/)){c=slug(m[1]);cats[c]=m[1];hd[c]=[+m[2],+m[3]];got[c]=[0,0];return}
  if(/^#\s/.test(l)){gr=l.replace(/^#\s+/,"").trim();return}
  if(m=l.match(/^\s*\[( |x)\]\s*(.+?)(\s*\(fracassada\))?\s*$/i)){
   if(!c){bad++;return}
   let b=c.slice(0,4)+"-"+slug(m[2]),id=b,n=2;while(ids.has(id))id=b+"-"+n++;ids.add(id);
   quests.push({id,ref:m[2],name:pt.get(m[2])||m[2],cat:c,group:gr,main:cats[c]=="Principais",missable:null,src:[]});
   got[c][1]++;if(m[3])prog[id]=2;else if(m[1]!=" "){prog[id]=1;got[c][0]++}return}
  if(/^\s*\[/.test(l))bad++});
 const diff=Object.keys(hd).filter(k=>hd[k][0]!=got[k][0]||hd[k][1]!=got[k][1]).map(k=>cats[k]+": arquivo "+hd[k].join("/")+", lido "+got[k].join("/"));
 const base={format:"jl-base",version:1,game:{id:"witcher3",title:"The Witcher 3: Wild Hunt",cover:"",sources:["Lista do checklist antigo (game-checklists.com e outras fontes)"],limits:"Base migrada como estava no checklist antigo; não foi revalidada nem pesquisada de novo."},cats,quests};
 return{base,prog,diff,bad,ptN:quests.filter(q=>q.name!=q.ref).length}}
/*ENDCORE*/

const K="jl:v1";let S={games:{},progress:{},covers:{}},locked=false,last="";
const V={q:"",f:"",o:"az",g:null,gq:"",c:"",s:""};
const warn=m=>{const e=document.getElementById("msg");if(!e.textContent.includes(m))e.textContent+=(e.textContent?" ":"")+m;e.style.display="block"};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r);S.covers=S.covers||{};localStorage.setItem("jl:t","1");if(localStorage.getItem("jl:t")!=="1")throw new Error("a gravação não persistiu");localStorage.removeItem("jl:t");if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
catch(e){locked=true;warn("Não consegui ler o armazenamento local ("+e.message+"). Para não sobrescrever nada, o salvamento está desligado nesta sessão.")}
function status(){document.getElementById("st").textContent=(locked?"Salvamento DESLIGADO. ":"Salvamento automático neste navegador"+(last?" · último às "+last:"")+". ")+"Endereço: "+(location.protocol=="file:"?"arquivo local":location.host)+" · jogos: "+Object.keys(S.games).length}
function save(){if(locked)return;try{const j=JSON.stringify(S);localStorage.setItem(K,j);if(localStorage.getItem(K)!==j)throw new Error("a verificação de leitura falhou");last=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});status()}catch(e){warn("Não foi possível salvar ("+e.message+"). Exporte um backup agora.")}}
if(location.protocol=="file:")warn("Você abriu o app como arquivo local. Alguns navegadores (e o visualizador de arquivos do celular) não mantêm dados assim; se o progresso sumir ao reabrir, hospede o site ou use o Backup completo.");
function dl(name,o){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
const backup=()=>dl("backup-biblioteca-"+stamp()+".json",{format:"jl-backup",version:1,data:S});
const h=(t,p,...c)=>{const e=document.createElement(t);for(const k in p||{})k in e?e[k]=p[k]:e.setAttribute(k,p[k]);e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const bar=p=>h("div",{className:"bar"},h("i",{style:"width:"+p+"%"}));
const REQ=t=>`Pesquise o jogo "${t}" em wikis especializadas, guias detalhados e fontes oficiais, comparando fontes complementares. Só me pergunte algo se houver ambiguidade relevante de edição/DLC que a pesquisa não resolva.
Catalogue TODAS as missões únicas encontráveis: campanha principal, secundárias, missões de personagens/facções, histórias opcionais, contratos e atividades estruturadas como missão, cadeias narrativas e missões de expansões narrativas. NÃO inclua troféus, colecionáveis sem estrutura de missão, equipamentos, objetivos internos de missões já listadas nem atividades genéricas.
Regras: não invente missões nem fontes; use nomes oficiais em pt-BR quando existirem; sem duplicatas; "main":true somente na campanha principal; em "missable" coloque um aviso curto, sem spoiler, nas missões perdíveis ou bloqueáveis por escolhas; investigue por que as fontes divergem nos totais e registre em "limits" o que não pôde ser confirmado; não apresente lista parcial como completa.
Responda SOMENTE com JSON válido neste formato (ids estáveis, únicos e em minúsculas, ex. "main-bloody-baron"):
{"format":"jl-base","version":1,"game":{"id":"slug-do-jogo","title":"Nome","cover":"https://... (opcional)","sources":["..."],"limits":"..."},"cats":{"main":"Principais","side":"Secundárias"},"quests":[{"id":"main-exemplo","ref":"Nome original","name":"Nome em português","cat":"main","group":"Ato ou região","main":true,"missable":null,"src":[]}]}`;

function dlg(t,...c){const o=h("div",{className:"modal"}),x=()=>o.remove();o.append(h("div",{className:"mb"},h("div",{className:"row"},h("h2",null,t),h("button",{textContent:"Fechar",onclick:x})),...c));document.body.append(o);return x}
function analyze(o){const f=o&&o.format;
 if(f=="jl-base"){const e=validBase(o);if(e.length)return{err:e};
  const id=o.game.id,old=S.games[id],n=o.quests.length,m=o.quests.filter(q=>q.main).length;
  if(!old)return{lines:[`Novo jogo: ${o.game.title} — ${n} missões únicas (${m} da campanha principal).`,"Os outros jogos não serão alterados."],apply(){S.games[id]=o;S.progress[id]={}}};
  const oi=new Set(old.quests.map(q=>q.id)),ni=new Set(o.quests.map(q=>q.id)),rm={},cnt={},map={};
  old.quests.forEach(q=>{const k=norm(q.ref||q.name);cnt[k]=(cnt[k]||0)+1;rm[k]=q.id});
  o.quests.forEach(q=>{if(!oi.has(q.id)){const k=norm(q.ref||q.name);if(cnt[k]==1)map[q.id]=rm[k]}});
  const add=o.quests.filter(q=>!oi.has(q.id)&&!map[q.id]).length,gone=[...oi].filter(i=>!ni.has(i)&&!Object.values(map).includes(i)).length;
  return{lines:[`Atualizar a base de ${old.game.title}: estados preservados pelo ID estável.`,`${o.quests.length-add-Object.keys(map).length} missões mantidas, ${Object.keys(map).length} reassociadas pelo nome original (estado copiado para o novo ID), ${add} novas (entram como pendentes).`,`${gone} missões da base antiga não aparecem na nova: seus estados continuam guardados, mas não contam nos percentuais.`],apply(){S.games[id]=o;const p=S.progress[id]||(S.progress[id]={});for(const k in map)if(p[map[k]]&&!p[k])p[k]=p[map[k]]}}}
 if(f=="jl-progress"){const g=S.games[o.gameId];if(!g||!o.states||typeof o.states!="object")return{err:["O jogo "+o.gameId+" não está na biblioteca, ou o arquivo é inválido."]};
  const ids=new Set(g.quests.map(q=>q.id)),cur=S.progress[o.gameId]||{},ks=Object.keys(o.states),ok=ks.filter(k=>ids.has(k)&&(o.states[k]==1||o.states[k]==2));
  return{lines:[`Progresso de ${g.game.title}: ${ok.length} estados reconhecidos (${ok.filter(k=>cur[k]!=o.states[k]).length} diferem do atual), ${ks.length-ok.length} IDs desconhecidos ignorados.`,"Mesclagem: só aplica concluídas/perdidas do arquivo; o que não está nele permanece como está."],apply(){const p=S.progress[o.gameId]||(S.progress[o.gameId]={});ok.forEach(k=>p[k]=o.states[k])}}}
 if(f=="jl-backup"){const d=o.data;if(!d||!d.games||typeof d.games!="object"||!d.progress)return{err:["Backup inválido."]};
  for(const k in d.games){const e=validBase(d.games[k]);if(e.length||d.games[k].game.id!=k)return{err:["Jogo "+k+" inválido no backup: "+(e[0]||"id divergente")]}}
  return{lines:[`Restaurar backup com ${Object.keys(d.games).length} jogo(s).`,"Isto SUBSTITUI toda a biblioteca atual (um backup do estado atual é baixado antes)."],apply(){S=d;S.covers=S.covers||{}}}}

function imp(title,pre=[],fn=jsonA,nt){const ta=h("textarea",{placeholder:"Cole aqui o conteúdo (ou carregue um arquivo abaixo)"}),f=h("input",{type:"file",accept:".json,.txt"}),out=h("div"),
 go=h("button",{className:"p",textContent:"Analisar",onclick:async()=>{out.replaceChildren();let a;try{a=await fn(ta.value)}catch(e){a={err:[e.message]}}
  if(a.err)return out.append(h("ul",{className:"bad"},a.err.map(x=>h("li",null,x))));
  out.append(h("ul",null,a.lines.map(x=>h("li",null,x))),h("button",{className:"p",textContent:"Confirmar e aplicar",onclick:()=>{if(Object.keys(S.games).length)backup();a.apply();save();close();render()}}))}});
 f.onchange=async()=>{if(f.files[0])ta.value=await f.files[0].text()};
 const close=dlg(title,...pre,...(nt?[]:[ta,f]),go,out)}
function legacy(t,html){if(S.games.witcher3)return{err:["O Witcher 3 já está na biblioteca; a migração só roda uma vez. Para aplicar outro progresso, use Importar."]};
 const r=legacyBase(t,html),n=r.base.quests.length;if(!n)return{err:["Nenhuma missão encontrada. Cole o texto exportado pela página antiga."]};
 if(r.diff.length||r.bad)return{err:["Conferência falhou, nada foi gravado: "+r.diff.join("; ")+(r.bad?` ${r.bad} linhas não interpretadas.`:"")]};
 const v=Object.values(r.prog);
 return{lines:[`${n} missões lidas em ${Object.keys(r.base.cats).length} categorias. Concluídas: ${v.filter(x=>x==1).length}. Perdidas (marcadas "fracassada"): ${v.filter(x=>x==2).length}.`,"Conferência: as contagens por categoria batem com os totais do arquivo.",`Nomes em português recuperados: ${r.ptN} de ${n}.`,"Missões não marcadas ficam pendentes. O checklist antigo não é alterado."],apply(){S.games.witcher3=r.base;S.progress.witcher3=r.prog}}}
function mig(){const hf=h("input",{type:"file",accept:".html,.htm"});
 imp("Migrar o checklist do Witcher 3",[h("p",{className:"mu"},"1) Na página antiga, clique em Exportar progresso e cole o texto abaixo (ou carregue o .txt). 2) Escolha também o HTML antigo para trazer os nomes em português (ele é só lido como texto, nada é executado). Nada vai para a internet."),hf],async t=>legacy(t,hf.files[0]?await hf.files[0].text():""))}
function add(){const t=h("input",{placeholder:"Nome do jogo (com edição/plataforma, se importar)"}),req=h("textarea",{readOnly:true,placeholder:"A solicitação aparecerá aqui."});
 t.oninput=()=>req.value=t.value.trim()?REQ(t.value.trim()):"";
 imp("Adicionar jogo",[h("p",{className:"mu"},"Este fluxo NÃO pesquisa sozinho: 1) digite o título, 2) copie a solicitação e cole no assistente de IA, 3) cole o JSON recebido abaixo e confira a prévia."),t,req,h("button",{textContent:"Copiar solicitação",onclick:()=>{req.select();if(navigator.clipboard)navigator.clipboard.writeText(req.value).catch(()=>{})}})])}
function cover(g){const id=g.game.id,u=h("input",{placeholder:"ou cole o link (https://...) de uma imagem"}),f=h("input",{type:"file",accept:"image/*"}),
 ok=v=>{if(v)S.covers[id]=v;else delete S.covers[id];save();x();render()};
